services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaultkeeper
      POSTGRES_PASSWORD: vaultkeeper
      POSTGRES_DB: vaultkeeper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vaultkeeper:vaultkeeper@db:5432/vaultkeeper
      SECRET_KEY: change-this-in-production
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
